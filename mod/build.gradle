// Useleess Carpet: the launcher jar (Java 8, plain Java, no libraries) with the patch that turns Mojang's official
// 1.12.2 server jar into the master Carpet server jar on the player's PC. See CODE_MAP.md.
plugins {
    id 'java'
}

group = 'com.useleess.carpet'
def minecraft = '1.12.2'

repositories { mavenCentral() }

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}

sourceSets {
    // build-time tools (patch maker + leak check): never part of the shipped jar
    tools {
        // main's classes only: main's built resources hold the patch these tools make
        compileClasspath += main.output.classesDirs
        runtimeClasspath += main.output.classesDirs + files('src/main/resources')
    }
    test {
        compileClasspath += tools.output
        runtimeClasspath += tools.output
    }
}

dependencies {
    // build-time only (RulesMaker and its tests): never in the shipped jar
    toolsImplementation 'org.ow2.asm:asm-tree:9.7.1'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

// The master server jar = Kisde Carpet (with Bullet + VasTech) + Redstone Scope, made by redstone-scope's
// buildCarpetJar. Here: straight from there. In a test-box / release copy: ../inputs/master-<mc>.jar, sent fresh by the
// release tools (../box-inputs.json, refused when older than Redstone Scope's code). Override with -Pmaster=<jar>.
// Mojang's jar is downloaded from Mojang into build/ if missing.
def masterJar = file(project.findProperty('master') ?: ["../inputs/master-${minecraft}.jar",
        '../../redstone-scope/mod/versions/1.12.2-carpet/Kisde-Carpet-server-1.12.2-RedstoneScope.jar']
        .collect { file(it) }.find { it.isFile() } ?: "../inputs/master-${minecraft}.jar")
def vanillaJar = file(project.findProperty('vanilla') ?: "build/mojang/minecraft_server.${minecraft}.jar")
def patchDir = layout.buildDirectory.dir('generated/patch')
def rulesJar = layout.buildDirectory.file("rules/rules-${minecraft}.jar").get().asFile

// master jar + our own Carpet rules (OurRules) = the jar the patch is made for
def makeRules = tasks.register('makeRules', JavaExec) {
    description = 'Adds our own Carpet rules and their hooks to the master jar'
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'com.useleess.carpet.tools.RulesMaker'
    inputs.file masterJar
    inputs.files sourceSets.tools.output
    outputs.file rulesJar
    args minecraft, masterJar.absolutePath, rulesJar.absolutePath
}
tasks.named('test') {
    dependsOn makeRules
    systemProperty 'useleess.masterJar', masterJar.absolutePath
    systemProperty 'useleess.rulesJar', rulesJar.absolutePath
}

def makePatch = tasks.register('makePatch', JavaExec) {
    description = 'Makes the patch from Mojang\'s jar and the rules jar, proves it rebuilds the rules jar exactly and ships no Mojang bytes'
    dependsOn compileJava, makeRules
    // classes + the source resources only (the built resources hold this task's own output)
    classpath = sourceSets.main.output.classesDirs + sourceSets.tools.output.classesDirs + files('src/main/resources')
    mainClass = 'com.useleess.carpet.tools.PatchMaker'
    maxHeapSize = '2g'
    inputs.file rulesJar
    inputs.files sourceSets.main.output.classesDirs, sourceSets.tools.output.classesDirs
    def out = patchDir.get().file('useleess-carpet/server.patch').asFile
    outputs.file out
    args minecraft, vanillaJar.absolutePath, rulesJar.absolutePath, out.absolutePath
}

sourceSets.main.resources.srcDir(patchDir)
processResources {
    dependsOn makePatch
    def v = project.version
    inputs.property 'version', v
    filesMatching('useleess-carpet/build.properties') { expand version: v }
}

jar {
    // useleess-carpet-<mc>-<version>.jar: release.py keeps only jars ending in -<version>.jar
    archiveBaseName = "useleess-carpet-${minecraft}"
    manifest { attributes 'Main-Class': 'com.useleess.carpet.launcher.Main', 'Implementation-Version': project.version }
    from(rootDir.parentFile) { include 'LICENSE', 'LICENSE-GPL', 'NOTICE.md' }
}
