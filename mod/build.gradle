// Useleess Carpet: the launcher jar (Java 8, plain Java, no libraries) with the patch that turns Mojang's official
// 1.12.2 server jar into the master Carpet server jar on the player's PC. See CODE_MAP.md.
plugins {
    id 'java'
}

group = 'com.useleess.carpet'
def minecraft = '1.12.2'

repositories { mavenCentral() }

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}

// Redstone Scope's name tables code (Mappings.java) is compiled in as it is, never copied into this repo: from
// redstone-scope on this PC, from ../inputs/rs-remap/ in a test-box / release copy (../box-inputs.json).
def rsMappings = ['../../redstone-scope/mod/versions/1.12.2-forge/src/carpetBuilder/java/com/redstonescope/carpetbuild/Mappings.java',
        '../inputs/rs-remap/Mappings.java'].collect { file(it) }.find { it.isFile() }
def rsGenerated = layout.buildDirectory.dir('generated/rs-remap')
def copyMappings = tasks.register('copyMappings', Copy) {
    description = 'Puts the Redstone Scope name tables (Mappings.java) where the tools source set compiles it'
    if (rsMappings == null) throw new GradleException('Mappings.java of Redstone Scope not found (redstone-scope/ or ../inputs/rs-remap/, see ../box-inputs.json)')
    from rsMappings
    into rsGenerated.map { it.dir('com/redstonescope/carpetbuild') }
}

sourceSets {
    // the server side that goes into the server jar (recipes editor): written in Minecraft's readable (MCP) names
    server {
        compileClasspath += main.output.classesDirs
    }
    // build-time tools (patch maker + leak check): never part of the shipped jar
    tools {
        java.srcDir rsGenerated
        // main's classes only: main's built resources hold the patch these tools make
        compileClasspath += main.output.classesDirs
        runtimeClasspath += main.output.classesDirs + files('src/main/resources')
    }
    test {
        compileClasspath += tools.output + server.output
        runtimeClasspath += tools.output + server.output
    }
}

dependencies {
    // build-time only (RulesMaker and its tests): never in the shipped jar
    toolsImplementation 'org.ow2.asm:asm-tree:9.7.1', 'org.ow2.asm:asm-commons:9.7.1'
    testImplementation 'org.ow2.asm:asm-tree:9.7.1'
    testImplementation 'com.google.code.gson:gson:2.8.9'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.named('compileToolsJava') { dependsOn copyMappings }

test {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

// The master server jar = Kisde Carpet (with Bullet + VasTech) + Redstone Scope, made by redstone-scope's
// buildCarpetJar. Here: straight from there. In a test-box / release copy: ../inputs/master-<mc>.jar, sent fresh by the
// release tools (../box-inputs.json, refused when older than Redstone Scope's code). Override with -Pmaster=<jar>.
// Mojang's jar is downloaded from Mojang into build/ if missing.
def masterJar = file(project.findProperty('master') ?: ["../inputs/master-${minecraft}.jar",
        '../../redstone-scope/mod/versions/1.12.2-carpet/Kisde-Carpet-server-1.12.2-RedstoneScope.jar']
        .collect { file(it) }.find { it.isFile() } ?: "../inputs/master-${minecraft}.jar")
def vanillaJar = file(project.findProperty('vanilla') ?: "build/mojang/minecraft_server.${minecraft}.jar")
def patchDir = layout.buildDirectory.dir('generated/patch')
def rulesJar = layout.buildDirectory.file("rules/rules-${minecraft}.jar").get().asFile

// Minecraft in readable (MCP) names for compiling src/server, and MCP's name tables: ForgeGradle's cache (made when
// Redstone Scope builds; the test box shares it through the toolchain's gradle home). Compile only, never shipped.
def forgeCache = "${gradle.gradleUserHomeDir}/caches/forge_gradle/minecraft_user_repo"
def mappedJar = file(project.findProperty('mappedJar') ?: "${forgeCache}/net/minecraftforge/forge/1.12.2-14.23.5.2860_mapped_snapshot_20171003-1.12/forge-1.12.2-14.23.5.2860_mapped_snapshot_20171003-1.12.jar")
def obfToSrg = file("${forgeCache}/de/oceanlabs/mcp/mcp_config/1.12.2-20200226.224830/obf_to_srg.tsrg")
def srgToMcp = file("${forgeCache}/de/oceanlabs/mcp/mcp_config/1.12.2-20200226.224830/srg_to_snapshot_20171003-1.12.tsrg")
dependencies { serverCompileOnly files(mappedJar, masterJar) }

// master jar + our own Carpet rules (OurRules) = the jar the patch is made for
def makeRules = tasks.register('makeRules', JavaExec) {
    description = 'Adds our own Carpet rules and their hooks to the master jar'
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = 'com.useleess.carpet.tools.RulesMaker'
    dependsOn tasks.named('compileJava'), tasks.named('serverClasses')
    inputs.file masterJar
    inputs.files sourceSets.tools.output, sourceSets.server.output.classesDirs, sourceSets.main.output.classesDirs
    inputs.files mappedJar, obfToSrg, srgToMcp
    outputs.file rulesJar
    doFirst {
        [mappedJar, obfToSrg, srgToMcp].each {
            if (!it.isFile()) throw new GradleException("missing ${it} (ForgeGradle's cache: build Redstone Scope once on this machine, or give -PmappedJar=)")
        }
    }
    args minecraft, masterJar.absolutePath, rulesJar.absolutePath,
            sourceSets.server.output.classesDirs.singleFile.absolutePath, sourceSets.main.output.classesDirs.singleFile.absolutePath,
            file('src/main/resources/assets/useleess_carpet/lang/en_us.json').absolutePath,
            mappedJar.absolutePath, obfToSrg.absolutePath, srgToMcp.absolutePath
}
tasks.named('test') {
    dependsOn makeRules
    systemProperty 'useleess.masterJar', masterJar.absolutePath
    systemProperty 'useleess.rulesJar', rulesJar.absolutePath
}

def makePatch = tasks.register('makePatch', JavaExec) {
    description = 'Makes the patch from Mojang\'s jar and the rules jar, proves it rebuilds the rules jar exactly and ships no Mojang bytes'
    dependsOn compileJava, makeRules
    // classes + the source resources only (the built resources hold this task's own output)
    classpath = sourceSets.main.output.classesDirs + sourceSets.tools.output.classesDirs + files('src/main/resources')
    mainClass = 'com.useleess.carpet.tools.PatchMaker'
    maxHeapSize = '2g'
    inputs.file rulesJar
    inputs.files sourceSets.main.output.classesDirs, sourceSets.tools.output.classesDirs
    def out = patchDir.get().file('useleess-carpet/server.patch').asFile
    outputs.file out
    args minecraft, vanillaJar.absolutePath, rulesJar.absolutePath, out.absolutePath
}

sourceSets.main.resources.srcDir(patchDir)
processResources {
    dependsOn makePatch
    def v = project.version
    inputs.property 'version', v
    filesMatching('useleess-carpet/build.properties') { expand version: v }
}

jar {
    // useleess-carpet-<mc>-<version>.jar: release.py keeps only jars ending in -<version>.jar
    archiveBaseName = "useleess-carpet-${minecraft}"
    manifest { attributes 'Main-Class': 'com.useleess.carpet.launcher.Main', 'Implementation-Version': project.version }
    from(rootDir.parentFile) { include 'LICENSE', 'LICENSE-GPL', 'NOTICE.md' }
}
